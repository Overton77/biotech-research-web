# Single request for dashboard overview (unfiltered totals; same connections as *Total queries).
query DashboardOverviewEntityTotals {
  organizationsConnection(first: 1) {
    totalCount
  }
  productsConnection(first: 1) {
    totalCount
  }
  labTestsConnection(first: 1) {
    totalCount
  }
  panelDefinitionsConnection(first: 1) {
    totalCount
  }
  peopleConnection(first: 1) {
    totalCount
  }
  studiesConnection(first: 1) {
    totalCount
  }
}
