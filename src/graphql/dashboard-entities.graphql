query DashboardOrganizations(
  $first: Int!
  $after: String
  $where: OrganizationWhere
) {
  organizationsConnection(
    first: $first
    after: $after
    sort: [{ name: ASC }]
    where: $where
  ) {
    totalCount
    aggregate {
      count {
        nodes
      }
      node {
        createdAt {
          min
          max
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        description
        canonicalTicker
        states(limit: 3) {
          id
          name
          sector
        }
        offersProducts(limit: 5) {
          __typename
          ... on Product {
            id
            name
          }
          ... on FoodProduct {
            id
            name
          }
        }
      }
    }
  }
}

query DashboardOrganizationsOffset(
  $limit: Int!
  $offset: Int!
  $where: OrganizationWhere
) {
  organizations(
    limit: $limit
    offset: $offset
    sort: [{ name: ASC }]
    where: $where
  ) {
    id
    name
    description
    canonicalTicker
    states(limit: 3) {
      id
      name
      sector
    }
    offersProducts(limit: 5) {
      __typename
      ... on Product {
        id
        name
      }
      ... on FoodProduct {
        id
        name
      }
    }
  }
}

query DashboardOrganizationTotal($where: OrganizationWhere) {
  organizationsConnection(first: 1, where: $where) {
    totalCount
  }
}

