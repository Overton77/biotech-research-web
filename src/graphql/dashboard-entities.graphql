query DashboardStudies(
  $first: Int!
  $after: String
  $where: StudyWhere
) {
  studiesConnection(
    first: $first
    after: $after
    sort: [{ name: ASC }]
    where: $where
  ) {
    totalCount
    aggregate {
      count {
        nodes
      }
      node {
        createdAt {
          min
          max
        }
        enrollmentCount {
          min
          max
          average
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        description
        overallStatus
        studyPhase
        enrollmentCount
        sponsoredBy(limit: 3) {
          id
          name
        }
        evaluates(limit: 4) {
          __typename
          ... on Product {
            id
            name
          }
          ... on Compound {
            id
            name
          }
          ... on CompoundForm {
            id
            name
          }
          ... on FoodItem {
            id
            name
          }
        }
      }
    }
  }
}

